<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>WebGPU 3rd Person Action</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
    canvas { width: 100vw; height: 100vh; display: block; }
    #ui {
      position: absolute; top: 10px; left: 10px; color: white;
      text-shadow: 1px 1px 2px black; pointer-events: none;
    }
    #error {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #ff5555; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 8px;
      display: none; text-align: center; font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h2>WebGPU TPS Dodge Demo</h2>
    <p>移動: <b>WASD</b> | 回避: <b>Space</b> | 視点移動: <b>マウスドラッグ</b></p>
  </div>
  <div id="error">WebGPUが利用できません。<br>ブラウザ設定でハードウェアアクセラレーションが有効か確認してください。</div>
  <canvas id="canvas"></canvas>

  <script type="module">
    // --- 簡易行列演算ライブラリ (外部依存排除用) ---
    const Mat4 = {
      create: () => new Float32Array(16),
      identity: (out) => {
        out.fill(0);
        out[0] = 1; out[5] = 1; out[10] = 1; out[15] = 1;
        return out;
      },
      perspective: (out, fovy, aspect, near, far) => {
        const f = 1.0 / Math.tan(fovy / 2);
        out.fill(0);
        out[0] = f / aspect;
        out[5] = f;
        out[10] = far / (near - far);
        out[11] = -1;
        out[14] = (far * near) / (near - far);
        return out;
      },
      lookAt: (out, eye, center, up) => {
        let z0 = eye[0] - center[0], z1 = eye[1] - center[1], z2 = eye[2] - center[2];
        let len = 1 / (Math.hypot(z0, z1, z2) || 1);
        z0 *= len; z1 *= len; z2 *= len;
        let x0 = up[1] * z2 - up[2] * z1, x1 = up[2] * z0 - up[0] * z2, x2 = up[0] * z1 - up[1] * z0;
        len = 1 / (Math.hypot(x0, x1, x2) || 1);
        x0 *= len; x1 *= len; x2 *= len;
        let y0 = z1 * x2 - z2 * x1, y1 = z2 * x0 - z0 * x2, y2 = z0 * x1 - z1 * x0;
        out[0] = x0; out[1] = y0; out[2] = z0; out[3] = 0;
        out[4] = x1; out[5] = y1; out[6] = z1; out[7] = 0;
        out[8] = x2; out[9] = y2; out[10] = z2; out[11] = 0;
        out[12] = -(x0 * eye[0] + x1 * eye[1] + x2 * eye[2]);
        out[13] = -(y0 * eye[0] + y1 * eye[1] + y2 * eye[2]);
        out[14] = -(z0 * eye[0] + z1 * eye[1] + z2 * eye[2]);
        out[15] = 1;
        return out;
      },
      multiply: (out, a, b) => {
        const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
        const a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
        const a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
        const a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
        let b0 = b[0], b1 = b[1], b2 = b[2], b3 = b[3];
        out[0] = b0*a00 + b1*a10 + b2*a20 + b3*a30;
        out[1] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
        out[2] = b0*a02 + b1*a12 + b2*a22 + b3*a32;
        out[3] = b0*a03 + b1*a13 + b2*a23 + b3*a33;
        b0 = b[4]; b1 = b[5]; b2 = b[6]; b3 = b[7];
        out[4] = b0*a00 + b1*a10 + b2*a20 + b3*a30;
        out[5] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
        out[6] = b0*a02 + b1*a12 + b2*a22 + b3*a32;
        out[7] = b0*a03 + b1*a13 + b2*a23 + b3*a33;
        b0 = b[8]; b1 = b[9]; b2 = b[10]; b3 = b[11];
        out[8] = b0*a00 + b1*a10 + b2*a20 + b3*a30;
        out[9] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
        out[10] = b0*a02 + b1*a12 + b2*a22 + b3*a32;
        out[11] = b0*a03 + b1*a13 + b2*a23 + b3*a33;
        b0 = b[12]; b1 = b[13]; b2 = b[14]; b3 = b[15];
        out[12] = b0*a00 + b1*a10 + b2*a20 + b3*a30;
        out[13] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
        out[14] = b0*a02 + b1*a12 + b2*a22 + b3*a32;
        out[15] = b0*a03 + b1*a13 + b2*a23 + b3*a33;
        return out;
      },
      translate: (out, a, v) => {
        let x = v[0], y = v[1], z = v[2];
        if (a === out) {
          out[12] = a[0] * x + a[4] * y + a[8] * z + a[12];
          out[13] = a[1] * x + a[5] * y + a[9] * z + a[13];
          out[14] = a[2] * x + a[6] * y + a[10] * z + a[14];
          out[15] = a[3] * x + a[7] * y + a[11] * z + a[15];
        }
        return out;
      },
      rotateY: (out, a, rad) => {
        let s = Math.sin(rad), c = Math.cos(rad);
        let a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
        let a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
        out[0] = a00 * c - a20 * s; out[1] = a01 * c - a21 * s;
        out[2] = a02 * c - a22 * s; out[3] = a03 * c - a23 * s;
        out[8] = a00 * s + a20 * c; out[9] = a01 * s + a21 * c;
        out[10] = a02 * s + a22 * c; out[11] = a03 * s + a23 * c;
        return out;
      },
      rotateX: (out, a, rad) => {
        let s = Math.sin(rad), c = Math.cos(rad);
        let a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
        let a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
        out[4] = a10 * c + a20 * s; out[5] = a11 * c + a21 * s;
        out[6] = a12 * c + a22 * s; out[7] = a13 * c + a23 * s;
        out[8] = a20 * c - a10 * s; out[9] = a21 * c - a11 * s;
        out[10] = a22 * c - a12 * s; out[11] = a23 * c - a13 * s;
        return out;
      }
    };

    // --- メイン処理 ---
    const canvas = document.getElementById('canvas');
    const errorDiv = document.getElementById('error');

    if (!navigator.gpu) {
      errorDiv.style.display = 'block';
      throw new Error("WebGPU not supported");
    }

    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) {
      errorDiv.style.display = 'block';
      throw new Error("No WebGPU adapter found");
    }

    const device = await adapter.requestDevice();
    const context = canvas.getContext('webgpu');
    const presentationFormat = navigator.gpu.getPreferredCanvasFormat();

    function resize() {
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = window.innerHeight * window.devicePixelRatio;
    }
    window.addEventListener('resize', resize);
    resize();

    context.configure({ device, format: presentationFormat, alphaMode: 'premultiplied' });

    const shaderModule = device.createShaderModule({
      code: `
        struct Uniforms {
          viewProjectionMatrix : mat4x4<f32>,
          modelMatrix : mat4x4<f32>,
          color : vec4<f32>,
        }
        @group(0) @binding(0) var<uniform> uniforms : Uniforms;

        struct VertexOutput {
          @builtin(position) Position : vec4<f32>,
          @location(0) fragPosition : vec3<f32>,
        }

        @vertex
        fn vs_main(@location(0) position : vec3<f32>) -> VertexOutput {
          var output : VertexOutput;
          let worldPosition = uniforms.modelMatrix * vec4<f32>(position, 1.0);
          output.Position = uniforms.viewProjectionMatrix * worldPosition;
          output.fragPosition = worldPosition.xyz;
          return output;
        }

        @fragment
        fn fs_main(in : VertexOutput) -> @location(0) vec4<f32> {
          let lightDir = normalize(vec3<f32>(0.5, 1.0, 0.3));
          let N = normalize(cross(dpdx(in.fragPosition), dpdy(in.fragPosition)));
          let diff = max(dot(N, lightDir), 0.2);
          return vec4<f32>(uniforms.color.rgb * diff, uniforms.color.a);
        }
      `
    });

    function createBoxData(width, height, depth) {
      const w = width / 2, h = height / 2, d = depth / 2;
      const vertices = new Float32Array([
        -w,-h, d,  w,-h, d,  w, h, d, -w, h, d,
        -w,-h,-d, -w, h,-d,  w, h,-d,  w,-h,-d,
        -w, h,-d, -w, h, d,  w, h, d,  w, h,-d,
        -w,-h,-d,  w,-h,-d,  w,-h, d, -w,-h, d,
         w,-h,-d,  w, h,-d,  w, h, d,  w,-h, d,
        -w,-h,-d, -w,-h, d, -w, h, d, -w, h,-d,
      ]);
      const indices = new Uint16Array([
        0,1,2, 0,2,3,    4,5,6, 4,6,7,    8,9,10, 8,10,11,
        12,13,14, 12,14,15, 16,17,18, 16,18,19, 20,21,22, 20,22,23
      ]);
      return { vertices, indices };
    }

    const cubeData = createBoxData(1, 2, 1);
    const groundData = createBoxData(100, 0.2, 100);

    function createBuffer(data, usage) {
      const buffer = device.createBuffer({
        size: (data.byteLength + 3) & ~3,
        usage,
        mappedAtCreation: true,
      });
      if (data instanceof Float32Array) new Float32Array(buffer.getMappedRange()).set(data);
      else if (data instanceof Uint16Array) new Uint16Array(buffer.getMappedRange()).set(data);
      buffer.unmap();
      return buffer;
    }

    const playerVB = createBuffer(cubeData.vertices, GPUBufferUsage.VERTEX);
    const playerIB = createBuffer(cubeData.indices, GPUBufferUsage.INDEX);
    const groundVB = createBuffer(groundData.vertices, GPUBufferUsage.VERTEX);
    const groundIB = createBuffer(groundData.indices, GPUBufferUsage.INDEX);

    const pipeline = device.createRenderPipeline({
      layout: 'auto',
      vertex: {
        module: shaderModule,
        entryPoint: 'vs_main',
        buffers: [{ arrayStride: 12, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }] }]
      },
      fragment: {
        module: shaderModule,
        entryPoint: 'fs_main',
        targets: [{ format: presentationFormat }]
      },
      primitive: { topology: 'triangle-list', cullMode: 'back' },
      depthStencil: { depthWriteEnabled: true, depthCompare: 'less', format: 'depth24plus' }
    });

    const uniformBufferSize = 64 + 64 + 16;
    const playerUniformBuffer = device.createBuffer({ size: uniformBufferSize, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    const groundUniformBuffer = device.createBuffer({ size: uniformBufferSize, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

    const playerBindGroup = device.createBindGroup({
      layout: pipeline.getBindGroupLayout(0),
      entries: [{ binding: 0, resource: { buffer: playerUniformBuffer } }]
    });
    const groundBindGroup = device.createBindGroup({
      layout: pipeline.getBindGroupLayout(0),
      entries: [{ binding: 0, resource: { buffer: groundUniformBuffer } }]
    });

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let cameraYaw = 0;
    let cameraPitch = 0.3;

    window.addEventListener('mousedown', e => { isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY }; });
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const deltaX = e.clientX - previousMousePosition.x;
      const deltaY = e.clientY - previousMousePosition.y;
      cameraYaw -= deltaX * 0.005;
      cameraPitch = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, cameraPitch + deltaY * 0.005));
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    const player = {
      pos: [0, 1, 0],
      rotY: 0,
      isDodging: false,
      dodgeTimer: 0,
      dodgeDuration: 0.35,
      dodgeDir: [0, 0, 0],
      dodgeSpeed: 20.0,
      normalSpeed: 8.0,
      rollAngle: 0
    };

    let depthTexture = null;
    let lastTime = performance.now();

    function frame(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      let moveX = 0, moveZ = 0;
      if (keys['KeyW']) moveZ -= 1;
      if (keys['KeyS']) moveZ += 1;
      if (keys['KeyA']) moveX -= 1;
      if (keys['KeyD']) moveX += 1;

      const len = Math.hypot(moveX, moveZ);
      let rotMoveX = 0, rotMoveZ = 0;
      if (len > 0) {
        moveX /= len; moveZ /= len;
        rotMoveX = moveX * Math.cos(cameraYaw) - moveZ * Math.sin(cameraYaw);
        rotMoveZ = moveX * Math.sin(cameraYaw) + moveZ * Math.cos(cameraYaw);
        if (!player.isDodging) {
          player.rotY = Math.atan2(rotMoveX, rotMoveZ);
        }
      }

      if (keys['Space'] && !player.isDodging) {
        player.isDodging = true;
        player.dodgeTimer = player.dodgeDuration;
        if (len === 0) {
          player.dodgeDir = [Math.sin(player.rotY), 0, Math.cos(player.rotY)];
        } else {
          player.dodgeDir = [rotMoveX, 0, rotMoveZ];
        }
      }

      if (player.isDodging) {
        player.dodgeTimer -= dt;
        player.pos[0] += player.dodgeDir[0] * player.dodgeSpeed * dt;
        player.pos[2] += player.dodgeDir[2] * player.dodgeSpeed * dt;
        player.rollAngle = (1 - (player.dodgeTimer / player.dodgeDuration)) * Math.PI * 2;

        if (player.dodgeTimer <= 0) {
          player.isDodging = false;
          player.rollAngle = 0;
        }
      } else if (len > 0) {
        player.pos[0] += rotMoveX * player.normalSpeed * dt;
        player.pos[2] += rotMoveZ * player.normalSpeed * dt;
      }

      const cameraDistance = 8.0;
      const camX = player.pos[0] + Math.sin(cameraYaw) * Math.cos(cameraPitch) * cameraDistance;
      const camY = player.pos[1] + 1.0 + Math.sin(cameraPitch) * cameraDistance;
      const camZ = player.pos[2] + Math.cos(cameraYaw) * Math.cos(cameraPitch) * cameraDistance;

      const viewMatrix = Mat4.create();
      Mat4.lookAt(viewMatrix, [camX, camY, camZ], [player.pos[0], player.pos[1] + 1.0, player.pos[2]], [0, 1, 0]);

      const projectionMatrix = Mat4.create();
      Mat4.perspective(projectionMatrix, Math.PI / 4, canvas.width / canvas.height, 0.1, 1000.0);

      const viewProjectionMatrix = Mat4.create();
      Mat4.multiply(viewProjectionMatrix, projectionMatrix, viewMatrix);

      // 地面描画データ準備
      const groundModel = Mat4.identity(Mat4.create());
      Mat4.translate(groundModel, groundModel, [0, -0.1, 0]);
      updateUniforms(groundUniformBuffer, viewProjectionMatrix, groundModel, [0.2, 0.6, 0.2, 1.0]);

      // プレイヤー描画データ準備
      const playerModel = Mat4.identity(Mat4.create());
      Mat4.translate(playerModel, playerModel, player.pos);
      Mat4.rotateY(playerModel, playerModel, player.rotY);
      if (player.isDodging) {
        Mat4.rotateX(playerModel, playerModel, player.rollAngle);
      }
      const playerColor = player.isDodging ? [0.0, 1.0, 1.0, 1.0] : [0.8, 0.2, 0.2, 1.0];
      updateUniforms(playerUniformBuffer, viewProjectionMatrix, playerModel, playerColor);

      if (!depthTexture || depthTexture.width !== canvas.width || depthTexture.height !== canvas.height) {
        if (depthTexture) depthTexture.destroy();
        depthTexture = device.createTexture({
          size: [canvas.width, canvas.height],
          format: 'depth24plus',
          usage: GPUTextureUsage.RENDER_ATTACHMENT
        });
      }

      const commandEncoder = device.createCommandEncoder();
      const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
          view: context.getCurrentTexture().createView(),
          clearValue: { r: 0.1, g: 0.1, b: 0.15, a: 1.0 },
          loadOp: 'clear',
          storeOp: 'store'
        }],
        depthStencilAttachment: {
          view: depthTexture.createView(),
          depthClearValue: 1.0,
          depthLoadOp: 'clear',
          depthStoreOp: 'store'
        }
      });

      renderPass.setPipeline(pipeline);

      renderPass.setBindGroup(0, groundBindGroup);
      renderPass.setVertexBuffer(0, groundVB);
      renderPass.setIndexBuffer(groundIB, 'uint16');
      renderPass.drawIndexed(groundData.indices.length);

      renderPass.setBindGroup(0, playerBindGroup);
      renderPass.setVertexBuffer(0, playerVB);
      renderPass.setIndexBuffer(playerIB, 'uint16');
      renderPass.drawIndexed(cubeData.indices.length);

      renderPass.end();
      device.queue.submit([commandEncoder.finish()]);

      requestAnimationFrame(frame);
    }

    function updateUniforms(buffer, vpMatrix, modelMatrix, color) {
      const data = new Float32Array(16 + 16 + 4);
      data.set(vpMatrix, 0);
      data.set(modelMatrix, 16);
      data.set(color, 32);
      device.queue.writeBuffer(buffer, 0, data);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
