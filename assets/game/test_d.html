        return undefined;
      };

    /* =========================================================
       VMD ROOT MOTION
    ========================================================= */

    function isRootMotionBone(
      name,
    ) {
      const n =
        normalizeBoneName(
          name,
        );

      return (
        n === "全ての親" ||
        n === "全ての親D" ||
        n === "センター" ||
        n === "センターD" ||
        n === "グルーブ" ||
        n === "グルーブD"
      );
    }

    /* =========================================================
       VMD PARSER
    ========================================================= */

    function parseVMD(
      buffer,
    ) {
      const r =
        new DataView(buffer);

      const u8 =
        new Uint8Array(
          buffer,
        );

      const dec =
        new TextDecoder(
          "shift-jis",
        );

      let p = 0;

      const readFixedString =
        (n) => {
          const bytes =
            u8.slice(
              p,
              p + n,
            );

          p += n;

          const z =
            bytes.indexOf(0);

          return dec
            .decode(
              z >= 0
                ? bytes.slice(
                    0,
                    z,
                  )
                : bytes,
            )
            .trim();
        };

      const header =
        readFixedString(30);

      if (
        !header.startsWith(
          "Vocaloid Motion Data",
        )
      ) {
        throw new Error(
          "VMDヘッダーが見つかりません",
        );
      }

      const modelName =
        readFixedString(20);

      const boneCount =
        r.getUint32(
          p,
          true,
        );

      p += 4;

      const tracks =
        new Map();

      let maxFrame = 0;

      let minFrame =
        Infinity;

      for (
        let i = 0;
        i < boneCount;
        i++
      ) {
        const rawName =
          readFixedString(
            15,
          );

        const frame =
          r.getUint32(
            p,
            true,
          );

        p += 4;

        const pos = [
          r.getFloat32(
            p,
            true,
          ),

          r.getFloat32(
            p + 4,
            true,
          ),

          r.getFloat32(
            p + 8,
            true,
          ),
        ];

        p += 12;

        const quat =
          qNormalize([
            r.getFloat32(
              p,
              true,
            ),

            r.getFloat32(
              p + 4,
              true,
            ),

            r.getFloat32(
              p + 8,
              true,
            ),

            r.getFloat32(
              p + 12,
              true,
            ),
          ]);

        p += 16;

        /*
         * VMD補間カーブ64byte
         */
        p += 64;

        const bi =
          findBoneIndex(
            rawName,
          );

        if (
          bi === undefined
        ) {
          continue;
        }

        const arr =
          tracks.get(
            bi,
          ) || [];

        /*
         * ルート移動は
         * ゲーム側のplayer座標と二重になるので無効化。
         */
        const storedPos =
          isRootMotionBone(
            pmx.bones[bi]
              ?.name,
          )
            ? [
                0,
                0,
                0,
              ]
            : pos;

        arr.push({
          frame,
          pos:
            storedPos,
          quat,
        });

        tracks.set(
          bi,
          arr,
        );

        maxFrame =
          Math.max(
            maxFrame,
            frame,
          );

        minFrame =
          Math.min(
            minFrame,
            frame,
          );
      }

      for (
        const arr of tracks.values()
      ) {
        arr.sort(
          (a, b) =>
            a.frame -
            b.frame,
        );
      }

      return {
        modelName,
        boneCount,
        tracks,

        maxFrame:
          Number.isFinite(
            maxFrame,
          )
            ? maxFrame
            : 0,

        minFrame:
          Number.isFinite(
            minFrame,
          )
            ? minFrame
            : 0,
      };
    }

    async function loadVMD(
      url,
    ) {
      const res =
        await fetch(url, {
          cache:
            "no-store",
        });

      if (!res.ok) {
        throw new Error(
          `VMD取得失敗 HTTP ${res.status}: ${url}`,
        );
      }

      return parseVMD(
        await res.arrayBuffer(),
      );
    }

    function makePose(
      q = [
        0,
        0,
        0,
        1,
      ],
      p = [
        0,
        0,
        0,
      ],
    ) {
      return {
        q,
        p,
      };
    }

    function lerp3(
      a,
      b,
      t,
    ) {
      return [
        a[0] +
          (b[0] - a[0]) *
            t,

        a[1] +
          (b[1] - a[1]) *
            t,

        a[2] +
          (b[2] - a[2]) *
            t,
      ];
    }

    function sampleVMD(
      motion,
      frame,
    ) {
      const pose =
        new Array(
          pmx.bones.length,
        );

      for (
        let i = 0;
        i < pose.length;
        i++
      ) {
        pose[i] =
          makePose();
      }

      if (!motion) {
        return pose;
      }

      for (
        const [
          bi,
          arr,
        ] of motion.tracks
      ) {
        if (!arr.length) {
          continue;
        }

        if (
          frame <=
          arr[0].frame
        ) {
          pose[bi] =
            makePose(
              arr[0].quat.slice(),
              arr[0].pos.slice(),
            );

          continue;
        }

        if (
          frame >=
          arr[
            arr.length - 1
          ].frame
        ) {
          pose[bi] =
            makePose(
              arr[
                arr.length - 1
              ].quat.slice(),

              arr[
                arr.length - 1
              ].pos.slice(),
            );

          continue;
        }

        let lo = 0;
        let hi =
          arr.length - 1;

        while (
          hi - lo >
          1
        ) {
          const mid =
            (lo + hi) >> 1;

          if (
            arr[mid].frame <=
            frame
          ) {
            lo = mid;
          } else {
            hi = mid;
          }
        }

        const a =
          arr[lo];

        const b =
          arr[hi];

        const t =
          (frame -
            a.frame) /
          Math.max(
            1,
            b.frame -
              a.frame,
          );

        pose[bi] =
          makePose(
            qSlerp(
              a.quat,
              b.quat,
              t,
            ),

            lerp3(
              a.pos,
              b.pos,
              t,
            ),
          );
      }

      return pose;
    }

    /* =========================================================
       MOTION STATE
    ========================================================= */

    const motions = {};

    let activeMotionState =
      "idle";

    let motionBlendFrom =
      null;

    let motionBlendElapsed =
      1;

    /*
     * ★ 走り出し→走りを滑らかにする。
     *
     * 以前の0.06秒では切り替えが急だったため、
     * 0.20秒に延長。
     */
    const MOTION_BLEND =
      0.20;

    /*
     * 走り出しの終了直前から全力走を重ね始める時間。
     * 最後の走り出し姿勢のまま移動してしまう時間をなくす。
     */
    const RUNSTART_RUN_OVERLAP = 0.20;

    function poseForState(
      state,
      elapsed,
    ) {
      const pose =
        new Array(
          pmx.bones.length,
        );

      for (
        let i = 0;
        i < pose.length;
        i++
      ) {
        pose[i] =
          makePose();
      }

      const motion =
        state === "idle"
          ? motions.idle
          : state === "runStart"
            ? motions.runStart
            : state === "run"
              ? motions.run
              : state === "dodge"
                ? motions.dash
                : null;

      if (motion) {
        const isOneShot =
          state ===
            "runStart" ||
          state === "dodge";

        let sampled;
        let loopPhase = 0;
        let frame =
          motion.minFrame;

        if (isOneShot) {
          frame =
            Math.min(
              motion.maxFrame,
              motion.minFrame +
                elapsed * 30,
            );

          sampled =
            sampleVMD(
              motion,
              frame,
            );
        } else {
          /*
           * 待機・走りはループ。
           */
          const loopFrames =
            Math.max(
              1,
              motion.maxFrame -
                motion.minFrame,
            );

          const rawFrame =
            (elapsed * 30) %
            loopFrames;

          const baseFrame =
            motion.minFrame +
            rawFrame;

          const sampleLoopVMD =
            (
              m,
              sampleFrame,
            ) => {
              const pose =
                new Array(
                  pmx.bones.length,
                );

              for (
                let i = 0;
                i < pose.length;
                i++
              ) {
                pose[i] =
                  makePose();
              }

              const cycleStart =
                m.minFrame;

              const cycleLength =
                Math.max(
                  1,
                  m.maxFrame -
                    m.minFrame,
                );

              const normalized =
                ((sampleFrame -
                  cycleStart) %
                  cycleLength +
                  cycleLength) %
                cycleLength;

              const f =
                cycleStart +
                normalized;

              for (
                const [
                  bi,
                  arr,
                ] of m.tracks
              ) {
                if (
                  !arr.length
                ) {
                  continue;
                }

                if (
                  arr.length ===
                  1
                ) {
                  pose[bi] =
                    makePose(
                      arr[0].quat.slice(),
                      arr[0].pos.slice(),
                    );

                  continue;
                }

                let lo = -1;
                let hi = -1;

                for (
                  let i = 0;
                  i < arr.length;
                  i++
                ) {
                  if (
                    arr[i].frame <=
                    f
                  ) {
                    lo = i;
                  }

                  if (
                    arr[i].frame >
                    f
                  ) {
                    hi = i;
                    break;
                  }
                }

                /*
                 * ループ境界:
                 * 最終キー→先頭キーを
                 * 周期上の隣接キーとして扱う。
                 */
                if (
                  lo < 0
                ) {
                  lo =
                    arr.length -
                    1;

                  hi = 0;
                } else if (
                  hi < 0
                ) {
                  lo =
                    arr.length -
                    1;

                  hi = 0;
                }

                const a =
                  arr[lo];

                const b =
                  arr[hi];

                const bFrame =
                  hi === 0
                    ? b.frame +
                      cycleLength
                    : b.frame;

                const aFrame =
                  a.frame;

                const sampleF =
                  f < aFrame
                    ? f +
                      cycleLength
                    : f;

                const t =
                  Math.max(
                    0,
                    Math.min(
                      1,
                      (sampleF -
                        aFrame) /
                        Math.max(
                          1e-6,
                          bFrame -
                            aFrame,
                        ),
                    ),
                  );

                pose[bi] =
                  makePose(
                    qSlerp(
                      a.quat,
                      b.quat,
                      t,
                    ),

                    lerp3(
                      a.pos,
                      b.pos,
                      t,
                    ),
                  );
              }

              return pose;
            };

          sampled =
            sampleLoopVMD(
              motion,
              baseFrame,
            );

          loopPhase =
            rawFrame /
            loopFrames;
        }

        /*
         * 走り出し専用の脚先行。
         */
        if (
          state ===
          "runStart"
        ) {
          const LEG_LEAD_FRAMES =
            8;

          const legFrame =
            Math.min(
              motion.maxFrame,
              frame +
                LEG_LEAD_FRAMES,
            );

          const legPose =
            sampleVMD(
              motion,
              legFrame,
            );

          const runReferencePose =
            motions.run
              ? sampleVMD(
                  motions.run,
                  motions.run.minFrame,
                )
              : null;

          const hipBlend =
            Math.min(
              1.0,
              0.80 +
                Math.min(
                  1,
                  elapsed /
                    (12 / 30),
                ) *
                  0.20,
            );

          const blendHipTowardRun =
            (names) => {
              if (
                !runReferencePose
              ) {
                return;
              }

              const bi =
                findBoneIndexAny(
                  ...names,
                );

              if (
                bi === undefined ||
                bi < 0
              ) {
                return;
              }

              const startQ =
                sampled[bi]?.q ||
                [
                  0,
                  0,
                  0,
                  1,
                ];

              const runQ =
                runReferencePose[
                  bi
                ]?.q ||
                startQ;

              sampled[bi] =
                makePose(
                  qSlerp(
                    startQ,
                    runQ,
                    hipBlend,
                  ),

                  sampled[bi]
                    ?.p?.slice() ||
                    [
                      0,
                      0,
                      0,
                    ],
                );
            };

          /*
           * 既存コードとの互換性を保つため
           * この関数自体は残しておく。
           */
          blendHipTowardRun([
            "左足",
            "左足D",
          ]);

          blendHipTowardRun([
            "右足",
            "右足D",
          ]);

          const copyBonePose =
            (names) => {
              const bi =
                findBoneIndexAny(
                  ...names,
                );

              if (
                bi === undefined ||
                bi < 0 ||
                !legPose[bi]
              ) {
                return;
              }

              sampled[bi] =
                makePose(
                  legPose[bi].q.slice(),
                  legPose[bi].p.slice(),
                );
            };

          copyBonePose([
            "左足",
            "左足D",
          ]);

          copyBonePose([
            "右足",
            "右足D",
          ]);

          copyBonePose([
            "左ひざ",
            "左ひざD",
            "左膝",
            "左膝D",
          ]);

          copyBonePose([
            "右ひざ",
            "右ひざD",
            "右膝",
            "右膝D",
          ]);

          copyBonePose([
            "左足首",
            "左足首D",
          ]);

          copyBonePose([
            "右足首",
            "右足首D",
          ]);

          copyBonePose([
            "左足ＩＫ",
            "左足IK",
          ]);

          copyBonePose([
            "右足ＩＫ",
            "右足IK",
          ]);

          copyBonePose([
            "左つま先ＩＫ",
            "左つま先IK",
          ]);

          copyBonePose([
            "右つま先ＩＫ",
            "右つま先IK",
          ]);

          const addHipBend =
            (
              names,
              deg,
            ) => {
              const bi =
                findBoneIndexAny(
                  ...names,
                );

              if (
                bi === undefined ||
                bi < 0 ||
                !sampled[bi]
              ) {
                return;
              }

              const baseQ =
                sampled[bi].q ||
                [
                  0,
                  0,
                  0,
                  1,
                ];

              const extraQ =
                eulerToQuat(
                  (deg *
                    Math.PI) /
                    180,
                  0,
                  0,
                );

              sampled[bi] =
                makePose(
                  qMul(
                    baseQ,
                    extraQ,
                  ),

                  sampled[bi]
                    ?.p?.slice() ||
                    [
                      0,
                      0,
                      0,
                    ],
                );
            };

          const hipBendDeg =
            92 *
            Math.max(
              0,
              1 -
                Math.min(
                  1,
                  elapsed /
                    (18 / 30),
                ),
            );

          const lowerBody =
            findBoneIndex(
              "下半身",
            );

          if (
            lowerBody !==
              undefined &&
            lowerBody >= 0
          ) {
            const q =
              sampled[
                lowerBody
              ]?.q ||
              [
                0,
                0,
                0,
                1,
              ];

            const lowerExtra =
              eulerToQuat(
                ((hipBendDeg *
                  0.24) *
                  Math.PI) /
                  180,

                0,

                0,
              );

            sampled[
              lowerBody
            ] =
              makePose(
                qMul(
                  q,
                  lowerExtra,
                ),

                sampled[
                  lowerBody
                ]?.p?.slice() ||
                  [
                    0,
                    0,
                    0,
                  ],
              );
          }
        }

        /*
         * 腰運動
         */
        const lowerBodyIndex =
          findBoneIndex(
            "下半身",
          );

        const upperBodyIndex =
          findBoneIndex(
            "上半身",
          );

        if (
          lowerBodyIndex !==
            undefined &&
          lowerBodyIndex >= 0
        ) {
          let waistAmp = 1.0;
          let waistFreq =
            2.15;

          if (
            state ===
            "runStart"
          ) {
            waistAmp =
              Math.min(
                1.0,
                0.9 +
                  elapsed *
                    0.35,
              );

            waistFreq =
              2.05;
          } else if (
            state === "run"
          ) {
            waistAmp = 1.0;
            waistFreq = 1.0;
          } else if (
            state === "dodge"
          ) {
            waistAmp = 0.70;
            waistFreq = 1.75;
          } else if (
            state === "idle"
          ) {
            /*
             * 待機VMDを主役にする。
             * 追加の腰揺れは極小。
             */
            waistAmp = 0.12;
            waistFreq = 0.55;
          } else {
            waistAmp = 0.45;
            waistFreq = 1.40;
          }

          const cycle =
            isOneShot
              ? elapsed *
                waistFreq
              : loopPhase *
                waistFreq;

          const phase =
            cycle *
            Math.PI *
            2;

          const pitchDeg =
            4.5 *
            Math.sin(
              phase +
                Math.PI *
                  0.15,
            ) *
            waistAmp;

          const yawDeg =
            7.5 *
            Math.sin(
              phase,
            ) *
            waistAmp;

          const rollDeg =
            5.5 *
            Math.sin(
              phase +
                Math.PI *
                  0.5,
            ) *
            waistAmp;

          const q =
            sampled[
              lowerBodyIndex
            ]?.q ||
            [
              0,
              0,
              0,
              1,
            ];

          const waistExtra =
            eulerToQuat(
              (pitchDeg *
                Math.PI) /
                180,

              (yawDeg *
                Math.PI) /
                180,

              (rollDeg *
                Math.PI) /
                180,
            );

          const baseP =
            sampled[
              lowerBodyIndex
            ]?.p?.slice() ||
            [
              0,
              0,
              0,
            ];

          let bobAmp = 0.0;
          let bobFreq = waistFreq;
          let bobY = 0.0;

          if (state === "runStart") {
            bobAmp = 1.15;
            bobFreq = 2.05;

            const bobCycle = elapsed * bobFreq;
            const bobPhase = bobCycle * Math.PI * 2;
            bobY = Math.sin(bobPhase + Math.PI * 0.5) * bobAmp;
          } else if (state === "run") {
            bobAmp = 1.60;
            bobFreq = 1.0;

            const bobCycle = loopPhase * bobFreq;
            const bobPhase = bobCycle * Math.PI * 2;
            bobY = Math.sin(bobPhase + Math.PI * 0.5) * bobAmp;
          } else if (state === "dodge") {
            /*
             * 回避専用の大きな弧運動。
             * 開始時は現在位置から自然に出発し、
             * 中盤で最高点、その後は元の高さへ戻る。
             */
            const u = Math.max(0, Math.min(1, elapsed / (55 / 30)));

            /*
             * 前半をやや急に持ち上げ、後半でなだらかに戻す。
             * sinカーブを基本にしつつ、powで前半の立ち上がりを調整。
             */
            const arc = Math.sin(Math.PI * Math.pow(u, 0.78));
            bobY = 5.0 * arc;
            bobFreq = 1.75;
          } else if (state === "idle") {
            bobAmp = 0.10;
            bobFreq = 0.55;

            const bobCycle = loopPhase * bobFreq;
            const bobPhase = bobCycle * Math.PI * 2;
            bobY = Math.sin(bobPhase + Math.PI * 0.5) * bobAmp;
          } else {
            bobAmp = 0.55;
            bobFreq = 1.40;

            const bobCycle = loopPhase * bobFreq;
            const bobPhase = bobCycle * Math.PI * 2;
            bobY = Math.sin(bobPhase + Math.PI * 0.5) * bobAmp;
          }

          baseP[1] +=
            bobY;

          /*
           * 回避専用の横方向軌道。
           *
           * 上下と前後の「動く速さ」をあえてずらす。
           *
           * 1. 開始直後は上下方向を素早く大きく動かす。
           * 2. 上下の動きが落ち着いてくる約0.4付近から
           *    前後方向を強く動かす。
           * 3. 中盤で腰が大きく前へ出た後、終盤で戻す。
           *
           * そのため横から見ると、単純な直線ではなく
           * 「縦→前→戻る」の大きな弧に近い軌跡になる。
           */
          let dodgeForward = 0.0;
          let dodgeArcY = 0.0;

          if (state === "dodge") {
            const u = Math.max(0, Math.min(1, elapsed / (55 / 30)));

            /* -------------------------------------------------
             * 上下：開始直後の速度を大きくする。
             * 約48%で最高点へ到達し、その後は下降。
             * ------------------------------------------------- */
            const upT = Math.min(1, u / 0.48);
            const upEase = 1 - Math.pow(1 - upT, 2.2);

            const downT = Math.max(0, Math.min(1, (u - 0.48) / 0.52));
            const downEase =
              downT *
              downT *
              (3 - 2 * downT);

            /*
             * 回避開始直後だけ、一瞬だけ腰を少し沈ませる。
             * 約0.12周期で元の高さへ戻るため、その後の大きな上昇を
             * 邪魔せず「一瞬沈む→すぐ上がる」という初動になる。
             */
            const dipDuration = 0.105;
            const dipT =
              Math.max(0, Math.min(1, u / dipDuration));
            const initialDip =
              -4.20 * Math.sin(Math.PI * dipT);

            dodgeArcY =
              initialDip +
              6.2 *
              (upEase * (1 - 0.10 * downT) - downEase * 0.90);

            /* -------------------------------------------------
             * 前後：上下の高速区間が終わり始める0.36付近から
             * 強く前進。0.62付近で最大速度感を作り、
             * その後は減速しながら元へ戻す。
             * ------------------------------------------------- */
            const moveStart = 0.36;
            const moveT = Math.max(0, Math.min(1, (u - moveStart) / (1 - moveStart)));

            /* 前半を強く、後半をゆっくりする非対称カーブ。 */
            const forwardRise =
              1 -
              Math.pow(1 - moveT, 3.4);

            const forwardReturnT =
              Math.max(0, Math.min(1, (moveT - 0.58) / 0.42));

            const forwardReturn =
              forwardReturnT *
              forwardReturnT *
              (3 - 2 * forwardReturnT);

            const forwardAmount =
              forwardRise *
              (1 - 0.88 * forwardReturn);

            /* このモデルでは -Z が前方向。 */
            dodgeForward =
              -6.8 *
              forwardAmount;
          }

          /* 既に bobY を加えているため、回避時は専用軌道に置き換える。 */
          if (state === "dodge") {
            baseP[1] -= bobY;
          }

          baseP[2] += dodgeForward;
          baseP[1] += dodgeArcY;

          sampled[
            lowerBodyIndex
          ] =
            makePose(
              qMul(
                q,
                waistExtra,
              ),
              baseP,
            );

          if (
            upperBodyIndex !==
              undefined &&
            upperBodyIndex >= 0
          ) {
            const upper =
              sampled[
                upperBodyIndex
              ] ||
              makePose();

            const upperP =
              upper.p?.slice() ||
              [
                0,
                0,
                0,
              ];

            upperP[1] +=
              state === "dodge"
                ? dodgeArcY * 0.84
                : bobY * 0.65;

            if (state === "dodge") {
              upperP[2] +=
                dodgeForward * 0.84;
            }

            const torsoExtra =
              eulerToQuat(
                (pitchDeg *
                  0.45 *
                  Math.PI) /
                  180,

                0,

                (rollDeg *
                  0.28 *
                  Math.PI) /
                  180,
              );

            sampled[
              upperBodyIndex
            ] =
              makePose(
                qMul(
                  upper.q ||
                    [
                      0,
                      0,
                      0,
                      1,
                    ],
                  torsoExtra,
                ),

                upperP,
              );
          }
        }

        return sampled;
        }
      }

      function blendPose(
        a,
        b,
        t,
      ) {
        const out =
          new Array(
            pmx.bones.length,
          );

        for (
          let i = 0;
          i < out.length;
          i++
        ) {
          const pa =
            a?.[i] ||
            makePose();

          const pb =
            b?.[i] ||
            makePose();

          out[i] =
            makePose(
              qSlerp(
                pa.q,
                pb.q,
                t,
              ),

              lerp3(
                pa.p,
                pb.p,
                t,
              ),
            );
        }

        return out;
      }

      /*
       * 走り出し→走りの姿勢ブレンド。
       *
       * 通常のsmoothstepを使い、切り替えの始点と終点で
       * 姿勢変化の速度を0に近づける。
       * これにより、切り替え直後だけ急に動き始めたり、
       * 終端でカクッと収束したりするのを防ぐ。
       */
      function smoothStep01(
        t,
      ) {
        t =
          Math.max(
            0,
            Math.min(
              1,
              t,
            ),
          );

        return t * t * (3 - 2 * t);
      }

      function applyMotionPose() {
        const target =
          poseForState(
            activeMotionState,
            motionStateTime,
          );

        let pose =
          target;

        if (
          motionBlendFrom &&
          motionBlendElapsed <
            MOTION_BLEND
        ) {
          let t =
            Math.min(
              1,
              motionBlendElapsed /
                MOTION_BLEND,
            );

          /*
           * ここでのみsmoothstep。
           * blendPose自体は通常のslerp/lerp。
           */
          t =
            smoothStep01(
              t,
            );

          pose =
            blendPose(
              motionBlendFrom,
              target,
              t,
            );
        }

        for (
          let i = 0;
          i < pmx.bones.length;
          i++
        ) {
          pmx.bones[
            i
          ].poseQ =
            pose[i]?.q ||
            [
              0,
              0,
              0,
              1,
            ];

          pmx.bones[
            i
          ].poseP =
            pose[i]?.p ||
            [
              0,
              0,
              0,
            ];
        }
      }

      async function initMotions() {
        loading.textContent =
          "移動・待機VMDを読み込み中…";

        const [
          idle,
          runStart,
          run,
          dashVmd,
        ] =
          await Promise.all([
            loadVMD(
              MOTION_PATHS.idle,
            ),

            loadVMD(
              MOTION_PATHS.runStart,
            ),

            loadVMD(
              MOTION_PATHS.run,
            ),

            loadVMD(
              MOTION_PATHS.dash,
            ),
          ]);

        motions.idle =
          idle;

        motions.runStart =
          runStart;

        motions.run =
          run;

        motions.dash =
          dashVmd;

        loading.textContent =
          `VMD読込完了：待機 ${idle.tracks.size}` +
          ` / 走り出し ${runStart.tracks.size}` +
          ` / 全力走 ${run.tracks.size}` +
          ` / ダッシュ ${dashVmd.tracks.size} ボーン`;
      }

      function getRunStartDuration() {
        const motion =
          motions.runStart;

        if (!motion) {
          return 1.0;
        }

        return Math.max(
          0.001,
          (motion.maxFrame -
            motion.minFrame) /
            30,
        );
      }

      /* =========================================================
       QUATERNION / IK
    ========================================================= */

    function matToQuat(m) {
      const tr =
        m[0] +
        m[5] +
        m[10];

      let x;
      let y;
      let z;
      let w;

      if (tr > 0) {
        const q =
          Math.sqrt(
            tr + 1,
          ) * 2;

        w =
          0.25 * q;

        x =
          (m[6] -
            m[9]) /
          q;

        y =
          (m[8] -
            m[2]) /
          q;

        z =
          (m[1] -
            m[4]) /
          q;
      } else if (
        m[0] > m[5] &&
        m[0] > m[10]
      ) {
        const q =
          Math.sqrt(
            1 +
              m[0] -
              m[5] -
              m[10],
          ) * 2;

        w =
          (m[6] -
            m[9]) /
          q;

        x =
          0.25 * q;

        y =
          (m[4] +
            m[1]) /
          q;

        z =
          (m[8] +
            m[2]) /
          q;
      } else if (
        m[5] > m[10]
      ) {
        const q =
          Math.sqrt(
            1 +
              m[5] -
              m[0] -
              m[10],
          ) * 2;

        w =
          (m[8] -
            m[2]) /
          q;

        x =
          (m[4] +
            m[1]) /
          q;

        y =
          0.25 * q;

        z =
          (m[9] +
            m[6]) /
          q;
      } else {
        const q =
          Math.sqrt(
            1 +
              m[10] -
              m[0] -
              m[5],
          ) * 2;

        w =
          (m[1] -
            m[4]) /
          q;

        x =
          (m[8] +
            m[2]) /
          q;

        y =
          (m[9] +
            m[6]) /
          q;

        z =
          0.25 * q;
      }

      return qNormalize([
        x,
        y,
        z,
        w,
      ]);
    }

    function qMul(a, b) {
      return qNormalize([
        a[3] * b[0] +
          a[0] * b[3] +
          a[1] * b[2] -
          a[2] * b[1],

        a[3] * b[1] -
          a[0] * b[2] +
          a[1] * b[3] +
          a[2] * b[0],

        a[3] * b[2] +
          a[0] * b[1] -
          a[1] * b[0] +
          a[2] * b[3],

        a[3] * b[3] -
          a[0] * b[0] -
          a[1] * b[1] -
          a[2] * b[2],
      ]);
    }

    function qInv(q) {
      return [
        -q[0],
        -q[1],
        -q[2],
        q[3],
      ];
    }

    function qFromTo(
      a,
      b,
    ) {
      const va =
        norm(a);

      const vb =
        norm(b);

      const d =
        Math.max(
          -1,
          Math.min(
            1,
            dot(
              va,
              vb,
            ),
          ),
        );

      if (
        d > 0.9999
      ) {
        return [
          0,
          0,
          0,
          1,
        ];
      }

      if (
        d < -0.9999
      ) {
        let axis =
          cross(
            [1, 0, 0],
            va,
          );

        if (
          Math.hypot(
            ...axis,
          ) < 0.001
        ) {
          axis =
            cross(
              [0, 1, 0],
              va,
            );
        }

        axis =
          norm(axis);

        return [
          axis[0],
          axis[1],
          axis[2],
          0,
        ];
      }

      const c =
        cross(
          va,
          vb,
        );

      return qNormalize([
        c[0],
        c[1],
        c[2],
        1 + d,
      ]);
    }

    function qToEulerXYZ(q) {
      const x = q[0];
      const y = q[1];
      const z = q[2];
      const w = q[3];

      const sinr =
        2 *
        (w * x +
          y * z);

      const cosr =
        1 -
        2 *
          (x * x +
            y * y);

      const roll =
        Math.atan2(
          sinr,
          cosr,
        );

      const sinp =
        2 *
        (w * y -
          z * x);

      let pitch;

      if (
        Math.abs(
          sinp,
        ) >= 0.999999
      ) {
        pitch =
          (Math.sign(
            sinp,
          ) *
            Math.PI) /
          2;
      } else {
        pitch =
          Math.asin(
            Math.max(
              -1,
              Math.min(
                1,
                sinp,
              ),
            ),
          );
      }

      const siny =
        2 *
        (w * z +
          x * y);

      const cosy =
        1 -
        2 *
          (y * y +
            z * z);

      const yaw =
        Math.atan2(
          siny,
          cosy,
        );

      return [
        roll,
        pitch,
        yaw,
      ];
    }

    /* =========================================================
       IK LINK LIMIT
    ========================================================= */

    function applyIKLinkLimit(
      joint,
      q,
      link,
    ) {
      let result =
        qNormalize(q);

      if (
        link?.limited &&
        link.min &&
        link.max
      ) {
        const e =
          qToEulerXYZ(
            result,
          );

        const x =
          Math.max(
            link.min[0],
            Math.min(
              link.max[0],
              e[0],
            ),
          );

        const y =
          Math.max(
            link.min[1],
            Math.min(
              link.max[1],
              e[1],
            ),
          );

        const z =
          Math.max(
            link.min[2],
            Math.min(
              link.max[2],
              e[2],
            ),
          );

        result =
          eulerToQuat(
            x,
            y,
            z,
          );
      }

      const name =
        normalizeBoneName(
          pmx.bones[joint]
            ?.name || "",
        );

      if (
        name.includes(
          "左ひざ",
        ) ||
        name.includes(
          "右ひざ",
        ) ||
        name.includes(
          "左膝",
        ) ||
        name.includes(
          "右膝",
        ) ||
        name.includes(
          "左ひざD",
        ) ||
        name.includes(
          "右ひざD",
        ) ||
        name.includes(
          "左膝D",
        ) ||
        name.includes(
          "右膝D",
        )
      ) {
        const e =
          qToEulerXYZ(
            result,
          );

        let minX =
          -Math.PI;

        let maxX =
          -0.0087266;

        if (
          link?.limited &&
          link.min &&
          link.max
        ) {
          minX =
            link.min[0];

          maxX =
            link.max[0];
        }

        const x =
          Math.max(
            minX,
            Math.min(
              maxX,
              e[0],
            ),
          );

        result =
          eulerToQuat(
            x,
            e[1],
            e[2],
          );
      }

      return result;
    }

    /* =========================================================
       BUILD WORLD
    ========================================================= */

    function buildWorld() {
      const world = [];

      for (
        let i = 0;
        i < pmx.bones.length;
        i++
      ) {
        const b =
          pmx.bones[i];

        const p =
          b.parent;

        const base =
          p >= 0
            ? [
                b.pos[0] -
                  pmx.bones[p]
                    .pos[0],

                b.pos[1] -
                  pmx.bones[p]
                    .pos[1],

                b.pos[2] -
                  pmx.bones[p]
                    .pos[2],
              ]
            : b.pos.slice();

        const pp =
          b.poseP ||
          [
            0,
            0,
            0,
          ];

        const local =
          mm(
            mt(
              base[0] +
                pp[0],

              base[1] +
                pp[1],

              base[2] +
                pp[2],
            ),

            quatToMat(
              b.poseQ ||
                [
                  0,
                  0,
                  0,
                  1,
                ],
            ),
          );

        world[i] =
          p >= 0
            ? mm(
                world[p],
                local,
              )
            : local;
      }

      return world;
    }

    /* =========================================================
       FOOT IK
    ========================================================= */

    function solveFootIK(
      world,
      ikName,
    ) {
      const ik =
        findBoneIndex(
          ikName,
        );

      if (
        ik === undefined ||
        ik < 0
      ) {
        return false;
      }

      const def =
        pmx.bones[ik]?.ik;

      if (
        !def ||
        !def.links ||
        def.links.length <
          1
      ) {
        return false;
      }

      const targetBone =
        def.target;

      if (
        targetBone < 0 ||
        targetBone >=
          pmx.bones.length
      ) {
        return false;
      }

      const target =
        mulPoint(
          world[ik],
          [
            0,
            0,
            0,
          ],
        );

      const isStart =
        activeMotionState ===
        "runStart";

      const iterations =
        ikName.includes(
          "つま先",
        )
          ? isStart
            ? 12
            : 7
          : isStart
            ? 16
            : 10;

      for (
        let iter = 0;
        iter < iterations;
        iter++
      ) {
        for (
          const rawLink of
            def.links
        ) {
          const link =
            typeof rawLink ===
            "number"
              ? {
                  bone:
                    rawLink,
                  limited:
                    false,
                  min:
                    null,
                  max:
                    null,
                }
              : rawLink;

          const joint =
            link.bone;

          if (
            joint ===
              undefined ||
            joint < 0 ||
            joint >=
              pmx.bones.length
          ) {
            continue;
          }

          const jointPos =
            mulPoint(
              world[joint],
              [
                0,
                0,
                0,
              ],
            );

          const endPos =
            mulPoint(
              world[
                targetBone
              ],
              [
                0,
                0,
                0,
              ],
            );

          const toEnd =
            sub(
              endPos,
              jointPos,
            );

          const toTarget =
            sub(
              target,
              jointPos,
            );

          if (
            Math.hypot(
              ...toEnd,
            ) < 1e-5 ||
            Math.hypot(
              ...toTarget,
            ) < 1e-5
          ) {
            continue;
          }

          let delta =
            qFromTo(
              toEnd,
              toTarget,
            );

          const strength =
            ikName.includes(
              "つま先",
            )
              ? isStart
                ? 0.72
                : 0.5
              : isStart
                ? 0.55
                : 0.28;

          delta =
            qSlerp(
              [
                0,
                0,
                0,
                1,
              ],
              delta,
              strength,
            );

          const jointWorldQ =
            matToQuat(
              world[joint],
            );

          const desiredWorldQ =
            qMul(
              delta,
              jointWorldQ,
            );

          const parent =
            pmx.bones[
              joint
            ].parent;

          const parentWorldQ =
            parent >= 0
              ? matToQuat(
                  world[parent],
                )
              : [
                  0,
                  0,
                  0,
                  1,
                ];

          let localQ =
            qMul(
              qInv(
                parentWorldQ,
              ),
              desiredWorldQ,
            );

          localQ =
            applyIKLinkLimit(
              joint,
              localQ,
              link,
            );

          pmx.bones[
            joint
          ].poseQ =
            localQ;

          const rebuilt =
            buildWorld();

          world.splice(
            0,
            world.length,
            ...rebuilt,
          );
        }

        const endPos =
          mulPoint(
            world[
              targetBone
            ],
            [
              0,
              0,
              0,
            ],
          );

        const error =
          Math.hypot(
            endPos[0] -
              target[0],

            endPos[1] -
              target[1],

            endPos[2] -
              target[2],
          );

        if (
          error < 0.025
        ) {
          break;
        }
      }

      return true;
    }

    /* =========================================================
       D BONE SYNCHRONIZATION
    ========================================================= */

    const deformMirrorPairs =
      [
        [
          "左足",
          "左足D",
        ],

        [
          "左ひざ",
          "左ひざD",
        ],

        [
          "左足首",
          "左足首D",
        ],

        [
          "右足",
          "右足D",
        ],

        [
          "右ひざ",
          "右ひざD",
        ],

        [
          "右足首",
          "右足首D",
        ],
      ]
        .map(
          ([
            src,
            dst,
          ]) => [
            findBoneIndex(
              src,
            ),
            findBoneIndex(
              dst,
            ),
          ],
        )
        .filter(
          ([
            src,
            dst,
          ]) =>
            src !==
              undefined &&
            dst !==
              undefined &&
            src >= 0 &&
            dst >= 0,
        );

    function syncDeformLegsFromSource() {
      for (
        const [
          src,
          dst,
        ] of deformMirrorPairs
      ) {
        pmx.bones[
          dst
        ].poseQ =
          pmx.bones[
            src
          ].poseQ.slice();

        pmx.bones[
          dst
        ].poseP =
          pmx.bones[
            src
          ].poseP.slice();
      }
    }

    /* =========================================================
       FINAL BONE MATRICES
    ========================================================= */

    function boneMatrices() {
      applyMotionPose();

      let world =
        buildWorld();

      if (
        activeMotionState ===
          "runStart" ||
        activeMotionState ===
          "run" ||
        activeMotionState ===
          "dodge"
      ) {
        solveFootIK(
          world,
          "左足ＩＫ",
        );

        solveFootIK(
          world,
          "右足ＩＫ",
        );

        world =
          buildWorld();

        solveFootIK(
          world,
          "左つま先ＩＫ",
        );

        solveFootIK(
          world,
          "右つま先ＩＫ",
        );

        world =
          buildWorld();
      }

      syncDeformLegsFromSource();

      /*
       * 走り出し専用の最終股関節補正。
       */
      if (
        activeMotionState ===
        "runStart"
      ) {
        const hipStrength =
          Math.max(
            0,
            1 -
              Math.min(
                1,
                motionStateTime /
                  0.60,
              ),
          );

        const hipDeg =
          92 *
          hipStrength;

        const addFinalHipBend =
          (
            names,
            deg,
          ) => {
            const bi =
              findBoneIndexAny(
                ...names,
              );

            if (
              bi === undefined ||
              bi < 0
            ) {
              return;
            }

            const q =
              pmx.bones[bi]
                .poseQ ||
              [
                0,
                0,
                0,
                1,
              ];

            const extra =
              eulerToQuat(
                (deg *
                  Math.PI) /
                  180,
                0,
                0,
              );

            pmx.bones[
              bi
            ].poseQ =
              qMul(
                q,
                extra,
              );
          };

        addFinalHipBend(
          [
            "左足",
            "左足D",
          ],
          hipDeg,
        );

        addFinalHipBend(
          [
            "右足",
            "右足D",
          ],
          hipDeg,
        );

        /*
         * 膝を後方へ曲げる。
         */
        const kneeStrength =
          Math.max(
            0,
            1 -
              Math.min(
                1,
                motionStateTime /
                  0.60,
              ),
          );

        const kneeDeg =
          70 *
          kneeStrength;

        const addFinalKneeBend =
          (
            names,
            deg,
          ) => {
            const bi =
              findBoneIndexAny(
                ...names,
              );

            if (
              bi === undefined ||
              bi < 0
            ) {
              return;
            }

            const q =
              pmx.bones[bi]
                .poseQ ||
              [
                0,
                0,
                0,
                1,
              ];

            const extra =
              eulerToQuat(
                (-deg *
                  Math.PI) /
                  180,
                0,
                0,
              );

            pmx.bones[
              bi
            ].poseQ =
              qMul(
                q,
                extra,
              );
          };

        addFinalKneeBend(
          [
            "左ひざ",
            "左ひざD",
            "左膝",
            "左膝D",
          ],
          kneeDeg,
        );

        addFinalKneeBend(
          [
            "右ひざ",
            "右ひざD",
            "右膝",
            "右膝D",
          ],
          kneeDeg,
        );

        /*
         * 骨盤側も少量連動。
         */
        const lower =
          findBoneIndex(
            "下半身",
          );

        if (
          lower !==
            undefined &&
          lower >= 0
        ) {
          const q =
            pmx.bones[lower]
              .poseQ ||
            [
              0,
              0,
              0,
              1,
            ];

          const extra =
            eulerToQuat(
              (hipDeg *
                0.10 *
                Math.PI) /
                180,

              0,

              0,
            );

          pmx.bones[
            lower
          ].poseQ =
            qMul(
              q,
              extra,
            );
        }

        syncDeformLegsFromSource();
      }

      world =
        buildWorld();

      const out =
        new Float32Array(
          pmx.bones.length *
            16,
        );

      for (
        let i = 0;
        i < pmx.bones.length;
        i++
      ) {
        out.set(
          mm(
            world[i],
            invBind[i],
          ),
          i * 16,
        );
      }

      return out;
    }

    /* =========================================================
       GROUND
    ========================================================= */

    const GROUND_SIZE =
      100;

    const groundVerts =
      new Float32Array([
        -GROUND_SIZE,
        0,
        -GROUND_SIZE,

        GROUND_SIZE,

    device.queue.writeBuffer(

    const groundShader = `
struct U {
  vp: mat4x4f,
  model: mat4x4f
};

struct O {
  @builtin(position) p: vec4f,
  @location(0) worldPos: vec3f
};

@group(0) @binding(0)
var<uniform> u: U;

@vertex
fn vs(
  @location(0) p: vec3f
) -> O {
  var o: O;
  let wp = u.model * vec4f(p, 1.0);
  o.p = u.vp * wp;
  o.worldPos = wp.xyz;
  return o;
}

@fragment
fn fs(i: O) -> @location(0) vec4f {
  let p = i.worldPos.xz;

  // 地面本体は完全な白。紫色は線の画素だけに直接描く。
  var c = vec3f(0.933, 0.949, 1.0);

  // 細い5mグリッド
  let g = p / 5.0;
  let gf = abs(fract(g - 0.5) - 0.5);
  let gd = min(gf.x, gf.y);
  let gridMask = step(0.493, gd);
  c = select(c, vec3f(0.30, 0.27, 0.62), gridMask > 0.5);

  // 太い25m主グリッド
  let mg = p / 25.0;
  let mf = abs(fract(mg - 0.5) - 0.5);
  let md = min(mf.x, mf.y);
  let majorMask = step(0.489, md);
  c = select(c, vec3f(0.16, 0.13, 0.42), majorMask > 0.5);

  // 中央十字
  let axisMask = max(
    1.0 - step(0.045, abs(p.x)),
    1.0 - step(0.045, abs(p.y))
  );
  c = select(c, vec3f(0.24, 0.20, 0.55), axisMask > 0.5);

  // 円周
  let ringR = length(p);
  let ringD = abs(fract(ringR / 12.5) - 0.5);
  let ringMask = step(0.493, ringD);
  c = select(c, vec3f(0.32, 0.27, 0.68), ringMask > 0.5);

  // 中央リング
  let centerD = abs(ringR - 4.5);
  let centerMask = 1.0 - step(0.065, centerD);
  c = select(c, vec3f(0.18, 0.13, 0.48), centerMask > 0.5);

  return vec4f(c, 1.0);
}
`

                    operation:
                      "add",
                  },

                  alpha: {
                    srcFactor:
                      "one",

                    dstFactor:
                      "one-minus-src-alpha",

                    operation:
                      "add",
                  },
                },
              },
            ],
          },

          primitive: {
            topology:
              "triangle-list",

            cullMode:
              "none",
          },

          depthStencil: {
            format:
              "depth24plus",

            depthWriteEnabled:
              false,

            depthCompare:
              "less-equal",
          },
        },
      );

    const shadowBind =
      device.createBindGroup({
        layout:
          shbgl,

        entries: [
          {
            binding: 0,

            resource: {
              buffer:
                shadowCamBuf,
            },
          },
        ],
      });

    /* =========================================================
       INPUT
    ========================================================= */

    const keys =
      Object.create(null);

    addEventListener(
      "keydown",
      (e) => {
        const key =
          e.key.toLowerCase();

        const code =
          e.code.toLowerCase();

        keys[key] = true;
        keys[code] = true;

        if (
          [
            " ",
            "arrowup",
            "arrowdown",
            "arrowleft",
            "arrowright",
          ].includes(key)
        ) {
          e.preventDefault();
        }

        if (key === "r") {
          reset();
        }
      },
    );

    addEventListener(
      "keyup",
      (e) => {
        const key =
          e.key.toLowerCase();

        const code =
          e.code.toLowerCase();

        keys[key] = false;
        keys[code] = false;
      },
    );

    /* =========================================================
       CAMERA
    ========================================================= */

    let cameraYaw = 0;
    let cameraPitch = 0.48;
    let mouseCaptured = false;

    canvas.addEventListener(
      "click",
      () => {
        if (
          document.pointerLockElement !==
          canvas
        ) {
          canvas.requestPointerLock();
        }
      },
    );

    document.addEventListener(
      "pointerlockchange",
      () => {
        mouseCaptured =
          document.pointerLockElement ===
          canvas;
      },
    );

    document.addEventListener(
      "mousemove",
      (e) => {
        if (!mouseCaptured) {
          return;
        }

        cameraYaw +=
          e.movementX *
          0.003;

        cameraPitch =
          Math.max(
            0.18,
            Math.min(
              1.15,
              cameraPitch +
                e.movementY *
                  0.0025,
            ),
          );
      },
    );

    /* =========================================================
       GAME STATE
    ========================================================= */

    let player;
    let enemies;
    let score;
    let wave;
    let hp;
    let stamina;
    let invuln;
    let dash;
    let dashDir;
    let spawn;
    let time;
    let animTime;
    let dead;
    let latched;
    let actionState;
    let actionTime;

    let playerFacing = 0;

    let motionStateTime =
      0;

    let wasMovingInput =
      false;


    const MAX_ENEMIES = 28;
    let enemySerial = 0;
    let enemySpawnTimer = 0.75;

    /* =========================================================
       RESET
    ========================================================= */

    function reset() {
      player = {
        x: 0,
        z: 0,

        vx: 0,
        vz: 0,
      };

      enemies = [];
      enemySpawnTimer = 0.55;

      score = 0;
      wave = 1;

      hp = 100;
      stamina = 100;

      invuln = 0;

      dash = 0;

      dashDir = {
        x: 0,
        z: 1,
      };

      spawn = 0.5;

      time = 0;
      animTime = 0;

      actionState =
        "idle";

      actionTime = 0;

      motionStateTime =
        0;

        "idle";

      wasMovingInput =
        false;

      motionBlendFrom =
        null;

      motionBlendElapsed =
        1;
