<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>New PS</title>
<link rel="icon" href="/media/icon.svg">
<meta name="theme-color" id="thecol" content="#f8fafc">
<link rel="manifest" href="/pwa/manifest?thecol=%23eef2ff&start=%2F&name=PS%20New">
<script>
try {
  navigator.serviceWorker.register("/pwa/sw?files=%5B%22%2F%22%5D")
    .then((registration) => {
      console.log('Service Worker registered with scope:', registration.scope);
    })
    .catch((error) => {
      console.error('Service Worker registration failed:', error);
    });
} catch(e) {
  alert(e);
}
</script>

<style>
/* Google Fonts */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --bg-gradient: linear-gradient(135deg, #f8fafc, #eef2ff);
  --surface: rgba(255, 255, 255, 0.7);
  --text: #0f172a;
  --text-light: #64748b;
  --border: rgba(255, 255, 255, 0.4);
  --radius: 16px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  background-color: #f8fafc;
}

body {
  font-family: "Inter", "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
  background: var(--bg-gradient);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 1.5rem;
}

/* Container / Card */
.card {
  background: var(--surface);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 2.5rem 2rem;
  width: 100%;
  max-width: 550px;
  box-shadow: var(--shadow);
  text-align: center;
  animation: fadeIn 0.4s ease-out;
}

h1 {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 1.5rem;
  color: var(--text);
}

/* Form Layout */
form {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

/* Form Inputs */
input {
  width: 100%;
  padding: 0.9rem 1.25rem;
  border-radius: 12px;
  border: 1px solid #cbd5e1;
  background: rgba(255, 255, 255, 0.9);
  font-size: 1rem;
  color: var(--text);
  outline: none;
  transition: all 0.2s ease;
}

input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
}

/* 非表示のURLパスワード入力フィールド */
input[type="password"] {
  display: none;
}

/* Output Display Area */
output {
  display: block;
  width: 100%;
  padding: 0.9rem 1.25rem;
  background: rgba(255, 255, 255, 0.6);
  border-radius: 12px;
  border: 1px solid rgba(203, 213, 225, 0.6);
  font-size: 0.95rem;
  color: var(--text-light);
  word-break: break-all;
  min-height: 3rem;
  text-align: left;
  cursor: pointer;
  transition: all 0.2s ease;
}

output:hover {
  background: rgba(255, 255, 255, 0.85);
  border-color: var(--primary);
}

/* Buttons */
input[type="submit"] {
  display: inline-block;
  padding: 0.8rem 1.6rem;
  border-radius: 999px;
  border: none;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  background: var(--primary);
  color: #ffffff;
  margin-top: 0.5rem;
}

input[type="submit"]:hover {
  background: var(--primary-dark);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="card">
  <h1>New PS</h1>
  <form method="get" action="/red">
    <input id="url" name="url" spellcheck="false" type="password">
    <output>请输入网址。</output>
    <input id="and" placeholder="请输入网址。" autocomplete="off">
    <input type="submit" value="发送">
  </form>
</div>

<script>
onload = () => {
  document.querySelector('#and').oninput = () => document.querySelector('#url').value = document.querySelector('#and').value;
  document.querySelector('#url').oninput = () => document.querySelector('output').value = document.querySelector('#url').value || '请输入网址。';
  document.querySelector('output').onclick = () => document.querySelector('#and').focus();
};
</script>

</body>
</html>
