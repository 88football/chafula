<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">

    <!-- 下レイヤー -->
    <path
      d="
      M70 340
      C70 285 150 250 256 250
      C395 250 455 285 470 345
      C455 405 390 435 256 435
      C130 435 70 395 70 340
      Z"
      fill="url(#base)"
    />

    <!-- メインレイヤー -->
    <path
      d="
      M40 235
      C40 150 145 95 270 95
      C405 95 485 145 490 230
      C485 315 405 360 270 360
      C145 360 40 315 40 235
      Z"
      fill="url(#main)"
    />

    <!-- 中間レイヤー -->
    <ellipse
      cx="285"
      cy="235"
      rx="150"
      ry="52"
      fill="#c7d2fe"
      opacity="0.55"
    />

    <!-- ハイライト -->
    <ellipse
      cx="275"
      cy="205"
      rx="105"
      ry="18"
      fill="#eef2ff"
      opacity="0.65"
    />

    <!-- アクセント -->
    <circle
      cx="405"
      cy="145"
      r="18"
      fill="#a5b4fc"
    />

    <circle
      cx="445"
      cy="180"
      r="9"
      fill="#c7d2fe"
    />

  </g>
</svg>
